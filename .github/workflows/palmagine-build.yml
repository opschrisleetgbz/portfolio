# Palmagine が自動生成したビルド用ワークフローです。編集しないでください。
# This workflow is auto-generated by Palmagine. Do not edit.
name: Palmagine Build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: palmagine-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package.json') }}
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund && \
            npx expo export --platform web --output-dir out
          } 2>&1 | tee build.log
      - name: Publish to dist branch
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p dist/_palmagine
          if [ "$OUTCOME" = "success" ]; then
            cp -r out/. dist/
            STATUS=success
          else
            tail -c 200000 build.log > dist/_palmagine/build.log
            STATUS=failure
          fi
          cat > dist/_palmagine/meta.json <<EOF
          {"sourceSha":"$GITHUB_SHA","status":"$STATUS","finishedAt":$(date +%s000),"framework":"expo"}
          EOF
          cd dist
          git init -b palmagine-dist
          git config user.name "palmagine-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "build: $GITHUB_SHA ($STATUS)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" palmagine-dist
      - name: Fail job on build error
        if: steps.build.outcome != 'success'
        run: exit 1
